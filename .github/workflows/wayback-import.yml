name: Import Historical Banners

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD or year)"
        required: true
        default: "2018-01-01"
      to_date:
        description: "End date (YYYY-MM-DD or year)"
        required: true
        default: "2018-12-31"
      cadence:
        description: "Wayback sampling cadence"
        required: true
        type: choice
        options:
          - monthly
          - weekly
          - daily
        default: monthly
      limit:
        description: "Maximum snapshots; 0 means all discovered"
        required: true
        default: "0"

permissions:
  contents: write

concurrency:
  group: bilibili-banner-data-writes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Import real assets from Wayback snapshots
        env:
          BANNER_PROFILE_MODE: "temporary"
          BANNER_TIMEZONE: "Asia/Shanghai"
        run: |
          python backend/wayback_import.py \
            --from-date "${{ inputs.from_date }}" \
            --to-date "${{ inputs.to_date }}" \
            --cadence "${{ inputs.cadence }}" \
            --limit "${{ inputs.limit }}"

      - name: Detect data changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all -- data)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Historical data changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No historical data change."
          fi

      - name: Commit imported historical banners
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "archive: import historical Bilibili banners"
          git push

name: Import Historical Banners

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Historical provider"
        required: true
        type: choice
        options:
          - auto
          - wayback-api
          - palxiao
          - wayback-html
        default: auto
      from_date:
        description: "Start date (not earlier than 2019-01-01)"
        required: true
        default: "2019-01-01"
      to_date:
        description: "End date; leave empty for today"
        required: false
        default: ""
      cadence:
        description: "Wayback sampling cadence"
        required: true
        type: choice
        options:
          - monthly
          - weekly
          - daily
          - 3h
        default: 3h
      limit:
        description: "Maximum snapshots; 0 means all discovered"
        required: true
        type: string
        default: "0"
      force:
        description: "Reprocess already imported dates"
        required: true
        type: boolean
        default: false
      verify_dom:
        description: "After HTTP recovery, optionally verify with Playwright"
        required: true
        type: boolean
        default: false
      clear_archive:
        description: "Clear existing historical archives before importing"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: bilibili-banner-data-writes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium for explicit verification
        if: inputs.verify_dom == true
        run: |
          python -m playwright install --with-deps chromium

      - name: Checkout MikuFan039 reference repository
        env:
          REFERENCE_COMMIT: "45b760bfa52166727123d775925dea887ac7d71a"
          REFERENCE_REPO: "${{ runner.temp }}/MikuFan039.github.io"
        run: |
          git clone https://github.com/MikuFan039/MikuFan039.github.io.git "$REFERENCE_REPO"
          git -C "$REFERENCE_REPO" checkout --detach "$REFERENCE_COMMIT"

      - name: Clear historical archive and index
        if: inputs.clear_archive == true
        run: |
          rm -rf data/archive
          mkdir -p data/archive
          touch data/archive/.gitkeep
          python -c 'import json; from pathlib import Path; Path("data/index.json").write_text(json.dumps({"version": 11, "generatedAt": "", "timeZone": "Asia/Shanghai", "timeSlotMinutes": 180, "records": []}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")'

      - name: Import historical Banner assets
        env:
          BANNER_PROFILE_MODE: "temporary"
          BANNER_TIMEZONE: "Asia/Shanghai"
          BANNER_TIME_SLOT_MINUTES: "180"
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          WAYBACK_CHECKPOINT_PAGES: "0"
          WAYBACK_CHECKPOINT_PUSH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FROM_DATE="${{ inputs.from_date }}"
          TO_DATE="${{ inputs.to_date }}"
          CADENCE="${{ inputs.cadence }}"
          LIMIT="${{ inputs.limit }}"
          PROVIDER="${{ inputs.provider }}"
          FORCE="${{ inputs.force }}"
          VERIFY_DOM="${{ inputs.verify_dom }}"
          REFERENCE_REPO="${{ runner.temp }}/MikuFan039.github.io"
          [[ -n "$FROM_DATE" ]] || FROM_DATE="2019-01-01"
          [[ -n "$TO_DATE" ]] || TO_DATE="$(date +%F)"
          [[ -n "$CADENCE" ]] || CADENCE="3h"
          [[ -n "$LIMIT" ]] || LIMIT="0"
          [[ -n "$PROVIDER" ]] || PROVIDER="auto"
          ARGS=(
            --provider "$PROVIDER"
            --from-date "$FROM_DATE"
            --to-date "$TO_DATE"
            --cadence "$CADENCE"
            --limit "$LIMIT"
            --checkpoint-every 1
            --checkpoint-script scripts/checkpoint_wayback.py
            --reference-repo "$REFERENCE_REPO"
            --reference-commit "45b760bfa52166727123d775925dea887ac7d71a"
          )
          [[ "$FORCE" == "true" ]] && ARGS+=(--force)
          [[ "$VERIFY_DOM" == "true" ]] && ARGS+=(--verify-dom)
          python backend/history_import.py "${ARGS[@]}"

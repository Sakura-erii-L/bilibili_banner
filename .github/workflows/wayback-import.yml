name: Import Historical Banners

on:
  push:
    branches:
      - main
    paths:
      - "backend/wayback_import.py"
      - ".github/workflows/wayback-import.yml"
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD or year)"
        required: true
        default: "2018-01-01"
      to_date:
        description: "End date (YYYY-MM-DD or year)"
        required: true
        default: "2018-12-31"
      cadence:
        description: "Wayback sampling cadence"
        required: true
        type: choice
        options:
          - monthly
          - weekly
          - daily
        default: monthly
      limit:
        description: "Maximum snapshots; 0 means all discovered"
        required: true
        default: "0"
  schedule:
    - cron: "27 2 2 * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: bilibili-banner-data-writes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Import real assets from Wayback snapshots
        env:
          BANNER_PROFILE_MODE: "temporary"
          BANNER_TIMEZONE: "Asia/Shanghai"
        run: |
          FROM_DATE="${{ inputs.from_date }}"
          TO_DATE="${{ inputs.to_date }}"
          CADENCE="${{ inputs.cadence }}"
          LIMIT="${{ inputs.limit }}"
          [[ -n "$FROM_DATE" ]] || FROM_DATE="2018-01-01"
          [[ -n "$TO_DATE" ]] || TO_DATE="$(date +%F)"
          [[ -n "$CADENCE" ]] || CADENCE="monthly"
          [[ -n "$LIMIT" ]] || LIMIT="0"
          python backend/wayback_import.py \
            --from-date "$FROM_DATE" \
            --to-date "$TO_DATE" \
            --cadence "$CADENCE" \
            --limit "$LIMIT"

      - name: Detect data changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all -- data)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Historical data changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No historical data change."
          fi

      - name: Commit imported historical banners
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "archive: import historical Bilibili banners"
          git push

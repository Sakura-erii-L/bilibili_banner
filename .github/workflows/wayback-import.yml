name: Import Historical Banners

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Historical provider"
        required: true
        type: choice
        options:
          - auto
          - wayback-api
          - palxiao
          - wayback-html
        default: auto
      from_date:
        description: "Start date (not earlier than 2019-08-01)"
        required: true
        default: "2019-08-01"
      to_date:
        description: "End date; leave empty for today"
        required: false
        default: ""
      cadence:
        description: "Wayback sampling cadence"
        required: true
        type: choice
        options:
          - monthly
          - weekly
          - daily
        default: monthly
      limit:
        description: "Maximum snapshots; 0 means all discovered"
        required: true
        type: string
        default: "0"
      force:
        description: "Reprocess already imported dates"
        required: true
        type: boolean
        default: false
      verify_dom:
        description: "After HTTP recovery, optionally verify with Playwright"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bilibili-banner-data-writes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium for explicit verification
        if: inputs.verify_dom == true
        run: |
          python -m playwright install --with-deps chromium

      - name: Import historical Banner assets
        env:
          BANNER_PROFILE_MODE: "temporary"
          BANNER_TIMEZONE: "Asia/Shanghai"
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          WAYBACK_CHECKPOINT_PAGES: "1"
          WAYBACK_CHECKPOINT_PUSH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FROM_DATE="${{ inputs.from_date }}"
          TO_DATE="${{ inputs.to_date }}"
          CADENCE="${{ inputs.cadence }}"
          LIMIT="${{ inputs.limit }}"
          PROVIDER="${{ inputs.provider }}"
          FORCE="${{ inputs.force }}"
          VERIFY_DOM="${{ inputs.verify_dom }}"
          [[ -n "$FROM_DATE" ]] || FROM_DATE="2019-08-01"
          [[ -n "$TO_DATE" ]] || TO_DATE="$(date +%F)"
          [[ -n "$CADENCE" ]] || CADENCE="monthly"
          [[ -n "$LIMIT" ]] || LIMIT="0"
          [[ -n "$PROVIDER" ]] || PROVIDER="auto"
          ARGS=(
            --provider "$PROVIDER"
            --from-date "$FROM_DATE"
            --to-date "$TO_DATE"
            --cadence "$CADENCE"
            --limit "$LIMIT"
            --checkpoint-every 1
            --checkpoint-script scripts/checkpoint_wayback.py
          )
          [[ "$FORCE" == "true" ]] && ARGS+=(--force)
          [[ "$VERIFY_DOM" == "true" ]] && ARGS+=(--verify-dom)
          python backend/history_import.py "${ARGS[@]}"

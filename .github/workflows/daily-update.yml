name: Daily Banner Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read
  pages: write

concurrency:
  group: bilibili-banner-data-writes
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture current Bilibili banner
        env:
          CI: "true"
          BANNER_PROFILE_MODE: "temporary"
          BANNER_TIMEZONE: "Asia/Shanghai"
          BANNER_TIME_SLOT_MINUTES: "180"
        run: |
          python backend/capture.py

      - name: Rebuild merged banner index
        run: |
          python backend/capture.py --rebuild-index

      - name: Detect data changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all -- data)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change."
          fi

      - name: Commit new unique banner
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "archive: update Bilibili banner"
          git push

      - name: Build static Pages site
        run: |
          python scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    runs-on: ubuntu-latest
    needs: update-and-build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
